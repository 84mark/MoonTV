name: Refresh IPTV fallback catalog
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iptv-catalog-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh official playlist
        run: python3 scripts/update-iptv-catalog.py
      - name: Save changed fallback
        run: |
          if git diff --quiet -- public/live/iptv.m3u; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/live/iptv.m3u
          git commit -m 'chore: refresh IPTV fallback catalog'
          git push origin HEAD:main
